name: QA Check

on:
  push:
  pull_request:
    branches: [main, master]
    paths:
      - "otterapi/**/*"
      - "pyproject.toml"
      - ".github/workflows/qa.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff linter
        run: uv run ruff check otterapi --output-format=github

      - name: Run ruff format check
        run: uv run ruff format otterapi --check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy otterapi --ignore-missing-imports
        continue-on-error: true # Don't fail CI yet, but report issues

  typecheck-generated:
    name: Type-check generated clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      # Needs the test group so pyright can resolve the generated clients'
      # imports (pandas / polars / pyarrow), plus the typecheck group (pyright).
      - name: Install dependencies
        run: uv sync --group test --group typecheck

      - name: Type-check generated clients with pyright
        run: uv run pytest otterapi/tests/test_generated_typecheck.py -m typecheck -v

      # Slow end-to-end proof that the large vendored real-world specs (Stripe,
      # GitHub) still generate, compile, and import. Runs once here rather than
      # in every OS/Python matrix cell (see the `test` job's ``-m "not slow"``).
      - name: Smoke-test real-world specs (generate + import)
        run: uv run pytest otterapi/tests/test_real_specs_smoke.py -m slow -v

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          # Wave 3.18 (issue #3 item 18): cheap insurance against the
          # encoding-class bugs that hit Windows in PR #2; one extra
          # cross-version run on the most common stack catches them on
          # the next minor release of Python.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Run tests with coverage
        # Slow real-world-spec smoke tests run once in the dedicated
        # ``typecheck-generated`` job, not in every matrix cell.
        run: uv run pytest otterapi/tests/ -m "not slow" -v --cov=otterapi --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0 — https://github.com/codecov/codecov-action/releases/tag/v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  test-no-extras:
    name: Test (no optional extras installed)
    runs-on: ubuntu-latest
    # Wave 3.18 (issue #3 item 18): exercise the lazy-import paths so
    # importing the codegen and generated client never *requires* pandas
    # / polars / pyarrow to be installed -- only when the matching
    # helpers are actually called.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      - name: Install only the base + dev groups (no test extras)
        run: uv sync --group dev --no-default-groups

      - name: Smoke import + minimal codegen
        run: |
          uv run python -c "from otterapi.codegen import Codegen, TypeGenerator, SchemaLoader; print('imports OK')"
          uv run python -c "from otterapi.config import DocumentConfig, get_config; print('config OK')"
          uv run python -c "from otterapi.cli import app; print('cli OK')"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test code generation with Petstore API
        run: |
          uv run otterapi generate -s https://petstore3.swagger.io/api/v3/openapi.json -o ./test_petstore_client

          # Verify files were created
          test -f ./test_petstore_client/models.py
          test -f ./test_petstore_client/endpoints.py
          test -f ./test_petstore_client/__init__.py

          # Verify generated code is valid Python
          python -m py_compile ./test_petstore_client/models.py
          python -m py_compile ./test_petstore_client/endpoints.py

      - name: Test CLI commands
        run: |
          uv run otterapi --help
          uv run otterapi version
          uv run otterapi validate https://petstore3.swagger.io/api/v3/openapi.json
