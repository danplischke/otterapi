name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — https://github.com/actions/checkout/releases/tag/v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 — https://github.com/actions/setup-python/releases/tag/v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v4.2.0

      - name: Build package
        run: uv build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 — https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: dist
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — https://github.com/actions/checkout/releases/tag/v4.3.1

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 — https://github.com/actions/download-artifact/releases/tag/v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15 — https://github.com/softprops/action-gh-release/releases/tag/v0.1.15
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1 — https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.1
        with:
          skip-existing: true
