name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2

      - name: Build package
        run: uv build

      - name: Check package
        # twine < 7 monkeypatches packaging's metadata allow-list to stop at
        # 2.4, so it rejects the Metadata-Version 2.5 that current hatchling
        # emits -- "'2.5' is not a valid metadata version" on a wheel PyPI
        # accepts fine. Pinned rather than left bare so a resolver picking an
        # older twine cannot break releases again.
        run: |
          pip install 'twine>=7.0.0'
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 — https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: dist
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 — https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 — https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.2
        with:
          skip-existing: true
