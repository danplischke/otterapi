[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"

[project]
name = "otterapi"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Plischke" }]
description = "A cute otter that turns OpenAPI & Swagger specs into type-safe, async Python clients — powered by httpx and Pydantic."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

dependencies = [
    # Lower bounds are the oldest versions otterapi is tested against; the
    # upper bounds only exclude the next major/minor with known breaking
    # changes. Compatible-release pins (~=) here forced every downstream
    # project onto one patch series of httpx and pydantic.
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.11,<3",
    "pydantic[email]>=2.12,<3",
    "pyyaml>=6.0.3,<7",
    "typer>=0.20,<1",
    "universal-pathlib>=0.3.4,<0.4",
    # tomllib is stdlib from 3.11; tomli is the same parser for 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.urls]
Source = "https://github.com/danplischke/otterapi"

[project.scripts]
otter = "otterapi.__main__:app"

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "responses>=0.24.0",
    "pytest-mock>=3.12.0",
    "fastapi>=0.139.0",
    "pandas>=2.3.3",
    "polars>=1.38.0",
    "pyarrow>=15",
]
dev = [
    { include-group = "test" },
    "ruff>=0.14.2",
    "twine>=6.2.0",
    "vulture>=2.14",
    # mypy was invoked by `just typecheck` and by CI without ever being
    # declared, so `uv run mypy` picked up whatever stray tool install was on
    # the machine -- one running an older Python, whose typeshed disagreed
    # with the ast API this codebase targets.
    "mypy>=1.19",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["otterapi", "/README.md"]

[tool.hatch.build.targets.sdist]
include = ["otterapi", "/README.md"]

[tool.ruff]
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".eggs",
    # Golden-file fixtures must remain byte-identical to what the codegen
    # actually emits; linting / formatting them silently breaks the diffs.
    "otterapi/tests/fixtures/golden",
]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "RUF018", # https://docs.astral.sh/ruff/rules/assignment-in-assert,
    "UP",
    "I",
    "TID251",
    # The mccabe and pydocstyle sections below configured rules that were
    # never selected, so neither had any effect.
    "C90",
    "D",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D101", # ignore missing in public class TODO: fix later
    "D103", # ignore missing in public function TODO: fix later
    "D102", # ignore missing docstring in public method
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["otterapi"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# don't format python in docstrings, pytest-examples takes care of it
docstring-code-format = false
quote-style = "single"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short"
]
testpaths = [
    "otterapi/tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.uv]
constraint-dependencies = [
    "starlette>=1.3.1",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "urllib3>=2.7.0",
    "python-dotenv>=1.2.2",
    "pygments>=2.20.0",
    "requests>=2.33.0",
]

[tool.coverage.run]
source = ["otterapi"]
omit = [
    "otterapi/tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.mypy]
# Deliberately unpinned python_version: this codebase builds ast nodes whose
# fields differ by interpreter version, so it must be checked against the
# interpreter it is running on. Oldest-supported-Python compatibility is the
# CI test matrix's job, not mypy's.
files = ["otterapi"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# The test suite is not type-clean yet; gating on the library is what protects
# users. Drop this exclusion once the tests are annotated.
exclude = "otterapi/tests/"

[tool.vulture]
min_confidence = 60
paths = ["otterapi", "vulture_whitelist.py"]
sort_by_size = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
