openapi: 3.0.0
info:
  title: Envelope API
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      tags: [Items]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
components:
  schemas:
    Envelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        status:
          type: string
    Item:
      type: object
      required: [id]
      properties:
        id:
          type: integer
