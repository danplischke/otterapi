openapi: 3.0.0
info:
  title: Optional Envelope API
  version: 1.0.0
paths:
  /things:
    get:
      operationId: listThings
      tags: [Things]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingEnvelope'
components:
  schemas:
    ThingEnvelope:
      type: object
      # `data` is intentionally NOT required -> typed `list[Thing] | None`, the
      # case that exercises the export None-guard and optional list detection.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        next_cursor:
          type: string
    Item:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
